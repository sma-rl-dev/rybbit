# tester-env deployment overlay for rybbit (fork root).
#
# Shape: upstream docker-compose.yml + deterministic tester-env overrides.
# Backend and client build from editable source (server/Dockerfile +
# client/Dockerfile); no prebuilt ghcr.io images are used as the deployment
# path. Postgres/ClickHouse/Redis hold all state; `reset` drops volumes.
#
# Evidence-backed requirements (prospect tag v2.8.0):
# - backend env BETTER_AUTH_SECRET (deterministic pinned value below),
#   DISABLE_SIGNUP=false, CLUSTER_WORKERS=1, DISABLE_TELEMETRY=true,
#   TRUSTED_ORIGINS=<browser origins> (consumed by the fork's cors.ts patch),
#   NODE_ENV=development (production forces Secure SameSite=None cookies that
#   plain-http browsers reject, breaking sessions).
# - backend/client ports published on 0.0.0.0 so containerized browsers reach
#   the stack via the host bridge gateway (172.17.0.1).
# - compose default network pinned to 172.16.0.0/24 (host pool exhaustion).
# - redis host port publish removed (host 6379 conflict); backend reaches
#   redis over the compose network (redis:6379).
# - optional same-origin Caddy proxy on :8080 (Caddyfile.tester-env): page and
#   API share one origin so backend origin checks pass; /api/* -> backend:3001,
#   everything else -> client:3002.
#
# Image policy: IMAGE_TAG is exported by scripts/rl-env (content-addressed);
# manual runs default to tester-env-rybbit:dev. RUN_ID must NOT scope image
# names - it only scopes containers/volumes via the compose project name set
# by the tester-env CLI (-p tester-env-rybbit[-$RUN_ID]).
services:
  redis:
    ports: !reset []

  backend:
    image: ${IMAGE_TAG:-tester-env-rybbit:dev}-backend
    build:
      context: .
      dockerfile: ./server/Dockerfile
    pull_policy: build
    ports: !override
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - TRUSTED_ORIGINS=http://172.17.0.1:3001,http://172.17.0.1:3002,http://172.17.0.1:8080
      - BETTER_AUTH_SECRET=tester-env-rybbit-deterministic-secret-0123456789abcdef
      - DISABLE_SIGNUP=false
      - DISABLE_TELEMETRY=true
      - CLUSTER_WORKERS=1
      - BASE_URL=http://172.17.0.1:3001

  client:
    image: ${IMAGE_TAG:-tester-env-rybbit:dev}-client
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://172.17.0.1:3001}
        NEXT_PUBLIC_DISABLE_SIGNUP: "false"
    pull_policy: build
    ports: !override
      - "${CLIENT_PORT:-3002}:3002"
    depends_on:
      - backend

  # Optional same-origin proxy (see Caddyfile.tester-env): page and API share
  # one origin so backend origin checks pass. Not part of upstream compose.
  proxy:
    image: caddy:2.10.0
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile.tester-env:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - client
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.16.0.0/24
